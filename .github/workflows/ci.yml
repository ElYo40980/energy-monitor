name: CI
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # revisión semanal de dependencias vulnerables

# Cancela ejecuciones obsoletas para no gastar cómputo (y energía) de más.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest pip-audit
      - run: pytest -q
      - run: python bench.py
      - run: pip-audit -r requirements.txt
